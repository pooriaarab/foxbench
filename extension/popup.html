<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>foxbench</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img class="mark" src="icons/icon-48.png" alt="" width="22" height="22" />
      <h1>foxbench tasks</h1>
    </header>
    <p class="intro">Run <code>npx foxbench serve</code>, then pick a task. The site opens in a new tab with the goal at the bottom.</p>
    <label for="server">Server</label>
    <input id="server" value="http://127.0.0.1:4173" spellcheck="false" />
    <label for="key">Control key</label>
    <input id="key" placeholder="printed by foxbench serve" spellcheck="false" />
    <h2>Tasks</h2>
    <ul id="tasks" aria-label="Tasks"></ul>
    <p id="status" role="status"></p>
    <script src="popup.js"></script>
  </body>
</html>
